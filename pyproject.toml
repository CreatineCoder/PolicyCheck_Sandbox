[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-decision-lab"
version = "0.1.0"
description = "Learning and evaluating decision policies purely from logged data."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "hydra-core>=1.3",
    "mlflow>=2.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
# obp is a cross-check dependency only (spec 7.4); it pins older numpy/scikit-learn
# ranges, so it is installed into a separate environment when needed.
crosscheck = ["obp>=0.5.5"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.9",
    "ruff>=0.4",
    "pandas-stubs",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src/odl"]
strict = true
plugins = []

[[tool.mypy.overrides]]
module = ["xgboost.*", "sklearn.*", "mlflow.*", "obp.*", "matplotlib.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
