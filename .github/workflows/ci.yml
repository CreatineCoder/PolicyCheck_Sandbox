name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src experiments tests
      - name: Typecheck
        run: mypy --strict src/odl
      # Tests run against the committed 10k-row OBD sample only, so CI needs no
      # large download. Reported numbers always come from the full dataset.
      - name: Test
        run: pytest --cov=src/odl --cov-report=term-missing
